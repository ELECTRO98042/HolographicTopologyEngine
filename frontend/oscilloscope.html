<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holographic HUD - CH-01 Oscilloscope</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #050808;
            overflow: hidden;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }
    
        *,
        *:before,
        *:after {
            box-sizing: inherit;
        }
    </style>
    <!-- Core Engine & Viewer Scripts -->
    <script type="module" src="/js/controlDeck.js"></script>
    <script type="module" src="/js/OscilloscopeViewer.js"></script>
</head>
<body>
    <div id="channel-mount" style="width: 100vw; height: 100vh; position: relative;"></div>
    <div id="oscilloscope-container">
        <canvas id="oscCanvas"></canvas>
    </div>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const mount = document.getElementById('channel-mount');
            if (!mount || !window.OscilloscopeViewer) {
                console.error('[CH-01] Missing mount or OscilloscopeViewer global.');
                return;
            }

            const viewer = new OscilloscopeViewer(mount);
            window.oscilloscopeViewer = viewer;
            viewer.connect('/ws/oscilloscope');

            window.addEventListener('message', (event) => {
                const msg = event.data;
                if (!msg || typeof msg !== 'object') return;
                if (msg.type === 'hud_update' && Array.isArray(msg.nodes)) {
                    viewer.updateWaveform(msg.nodes);
                } else if (msg.projection || msg.latest || msg.history) {
                    viewer.updateWaveform(msg.projection || msg);
                }
            });
        });
    </script>
</body>
</html>
