<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Holographic Topology Engine HUD v3.0 (WebGL Unified)</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            margin: 0;
            background-color: #05050a;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        #hud-container {
            position: absolute;
            top: 20px;
            left: 20px;
            height: auto;
            width: 320px;
            background: rgba(5, 5, 10, 0.85);
            border: 1px solid #00ffcc;
            padding: 15px;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            pointer-events: none;
            z-index: 100;
        }

        h3 {
            font-size: 16px;
            margin: 0 0 10px 0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .hud-integrity,
        .hud-ee,
        .hud-phi {
            font-size: 14px;
            margin: 5px 0;
        }

        canvas {
            display: block;
        }

        /* Spatial Control Deck Styling */
        #spatial-control-deck {
            position: absolute;
            top: 145px;
            left: 20px;
            width: 300px;
            background: rgba(5, 5, 10, 0.95);
            border: 1px solid #00ffcc;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            color: #00ffcc;
            z-index: 100;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.15);
            font-size: 11px;
            pointer-events: auto;
        }

        .deck-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(0, 255, 204, 0.1);
            border-bottom: 1px solid rgba(0, 255, 204, 0.3);
        }

        .deck-header h3 {
            margin: 0;
            font-size: 12px;
            letter-spacing: 1px;
        }

        #deck-collapse-btn {
            background: transparent;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            cursor: pointer;
            width: 18px;
            height: 18px;
            font-weight: bold;
            line-height: 14px;
            text-align: center;
        }

        .deck-body {
            padding: 10px 12px;
            max-height: 75vh;
            overflow-y: auto;
        }

        .deck-section {
            margin-bottom: 8px;
        }

        .control-field {
            margin-bottom: 6px;
        }

        .control-field label,
        .section-label,
        .slider-group label {
            display: block;
            font-size: 10px;
            text-transform: uppercase;
            color: #00ffccaa;
            margin-bottom: 2px;
        }

        .control-field select {
            width: 100%;
            background: #05050a;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 5px;
            font-family: inherit;
            font-size: 10px;
            border-radius: 2px;
            cursor: pointer;
        }

        .deck-divider {
            border: none;
            border-top: 1px solid rgba(0, 255, 204, 0.2);
            margin: 8px 0;
        }

        .slider-group {
            margin-bottom: 6px;
        }

        .slider-label-row {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #00ffccaa;
            margin-bottom: 2px;
        }

        .slider-group input[type="range"] {
            width: 100%;
            accent-color: #00ffcc;
            background: transparent;
            cursor: pointer;
        }

        .overlay-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
        }

        .overlay-toggle {
            background: rgba(5, 5, 10, 0.8);
            border: 1px solid rgba(0, 255, 204, 0.4);
            color: #00ffcc;
            font-size: 9px;
            padding: 5px 2px;
            cursor: pointer;
            text-align: center;
            border-radius: 2px;
            font-family: inherit;
            transition: all 0.2s ease;
            pointer-events: auto;
        }

        .overlay-toggle.active {
            background: rgba(0, 255, 204, 0.3);
            border-color: #00ffcc;
            color: #fff;
            box-shadow: 0 0 5px rgba(0, 255, 204, 0.5);
        }

        .action-matrix {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .button-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
        }

        .action-btn {
            background: rgba(0, 255, 204, 0.08);
            border: 1px solid rgba(0, 255, 204, 0.4);
            color: #00ffcc;
            font-family: inherit;
            font-size: 9px;
            padding: 5px 2px;
            cursor: pointer;
            text-align: center;
            border-radius: 2px;
            text-transform: uppercase;
        }

        .action-btn:hover {
            background: rgba(0, 255, 204, 0.25);
            border-color: #00ffcc;
        }

        .deck-header .header-json-btn {
            background: transparent !important;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            font-size: 9px;
            font-weight: bold;
            padding: 3px 6px;
            cursor: pointer;
            margin: 0 4px;
            border-radius: 2px;
        }

        .deck-header .header-json-btn:hover {
            background: #00ffcc !important;
            color: #05050a;
        }
    </style>
    <link rel="stylesheet" href="css/testingSuite.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <!-- Primary Telemetry HUD -->
    <div id="hud-container" style="width: 299px;">
        <h3>HOLOGRAPHIC HUD V3.0</h3>
        <div class="hud-integrity">System Integrity: 100%</div>
        <div class="hud-ee">Entanglement (See): 0.0</div>
        <div class="hud-phi">Integrated Info (Phi): 0.0</div>
    </div>

    <!-- Spatial Control Deck -->
    <div id="spatial-control-deck">
        <div class="deck-header">
            <h3>SPATIAL CONTROL DECK</h3>
            <button id="import-json-btn" class="header-json-btn">JSON IMPORT</button>
            <input type="file" id="topologyJsonInput" accept=".json" style="display: none;" />
            <button id="deck-collapse-btn" title="Toggle Deck">-</button>
        </div>

        <div class="deck-body" id="deck-body-content">
            <div class="deck-section">
                <div class="control-field">
                    <label>Reference Frame</label>
                    <select id="ref-frame-select">
                        <option value="open">Open Space (Default)</option>
                        <option value="spheroid">Spheroid</option>
                        <option value="cubed">Cubed</option>
                        <option value="toroidal">Toroidal</option>
                        <option value="hyperbolic">Hyperbolic</option>
                    </select>
                </div>

                <div class="control-field">
                    <label>Telemetry Stream Filter</label>
                    <select id="stream-filter-select">
                        <option value="all">All Channels (Active)</option>
                        <option value="primary">Primary Array Only</option>
                        <option value="anomaly">Anomaly Filtered</option>
                    </select>
                </div>

                <div class="control-field">
                    <label>Data Interpolation Mode</label>
                    <select id="interpolation-select">
                        <option value="linear">Linear</option>
                        <option value="spline">Spline</option>
                        <option value="discrete">Discrete Step</option>
                    </select>
                </div>

                <div class="control-field">
                    <label>Color Palette / Schema</label>
                    <select id="palette-select">
                        <option value="dynamic">Dynamic (Default)</option>
                        <option value="qe">1. Quantum Entanglement (QE)</option>
                        <option value="ads">2. AdS/CFT Duality</option>
                        <option value="snr">3. Signal Integrity (SNR)</option>
                        <option value="thermal">4. Thermal Dissipation (T)</option>
                        <option value="em">5. Electromagnetic Field (EM)</option>
                        <option value="doppler">6. Doppler Shift (Δf)</option>
                        <option value="tension">7. Tensegrity Tension (sigma)</option>
                        <option value="vacuum">8. Vacuum Fluctuations (Λ)</option>
                        <option value="composite">Full Multiplexed Composite</option>
                    </select>
                </div>
            </div>

            <hr class="deck-divider">

            <div class="deck-section">
                <div class="slider-group">
                    <div class="slider-label-row" style="align-items: center;">
                        <label>World Scale / Extent</label>
                        <div style="display: flex; align-items: center; gap: 6px;">
                            <label style="font-size: 8px; color: #00ffccaa; cursor: pointer;" for="checkbox-floor">Floor
                                On</label>
                            <input type="checkbox" id="checkbox-floor" checked
                                style="accent-color: #00ffcc; cursor: pointer; transform: scale(0.8);">
                            <span id="val-world-scale">1.0</span>
                        </div>
                    </div>
                    <input type="range" id="slider-world-scale" min="0.5" max="3.0" step="0.1" value="1.0">
                </div>

                <div class="slider-group">
                    <div class="slider-label-row">
                        <label>Grid Resolution / Density</label>
                        <span id="val-grid-density">10</span>
                    </div>
                    <input type="range" id="slider-grid-density" min="5" max="30" step="1" value="10">
                </div>

                <div class="slider-group">
                    <div class="slider-label-row">
                        <label>Temporal Motion Speed</label>
                        <span id="val-motion-speed">1.0x</span>
                    </div>
                    <input type="range" id="slider-motion-speed" min="0.0" max="5.0" step="0.1" value="1.0">
                </div>

                <div class="slider-group">
                    <div class="slider-label-row">
                        <label>Signal Noise Threshold</label>
                        <span id="val-noise-thresh">0.05</span>
                    </div>
                    <input type="range" id="slider-noise-thresh" min="0.0" max="0.5" step="0.01" value="0.05">
                </div>

                <div class="slider-group">
                    <div class="slider-label-row">
                        <label>Diagnostic Overlay Luminosity</label>
                        <span id="val-overlay-intensity">1.0x</span>
                    </div>
                    <input type="range" id="slider-overlay-intensity" min="0.1" max="3.0" step="0.1" value="1.0">
                </div>
            </div>

            <hr class="deck-divider">

            <div class="deck-section">
                <label class="section-label">Interference Overlays</label>
                <div class="overlay-grid">
                    <button class="overlay-toggle" data-overlay="thermal">Thermal</button>
                    <button class="overlay-toggle" data-overlay="wave">Wave Interf.</button>
                    <button class="overlay-toggle" data-overlay="emp">EMP Dist.</button>
                    <button class="overlay-toggle" data-overlay="atmos">Atmospheric</button>
                    <button class="overlay-toggle" data-overlay="doppler">Doppler</button>
                    <button class="overlay-toggle" data-overlay="multipath">Multipath</button>
                </div>
            </div>

            <!-- 4. Data Persistence & State Control -->
            <div class="deck-section action-matrix">
                <div class="button-group export-group">
                    <button id="btn-export-json" class="action-btn">JSON Config</button>
                    <button id="btn-export-csv" class="action-btn">CSV Data</button>
                    <button id="btn-export-dot" class="action-btn">DOT Graph</button>
                </div>
                <div class="button-group state-group">
                    <button id="btn-pin-all" class="action-btn">Pin All</button>
                    <button id="btn-release-all" class="action-btn">Release All</button>
                    <button id="btn-reset-view" class="action-btn" onclick="window.resetCamera()">Reset View</button>
                </div>
            </div>

            <!-- 5. Expansion Buffer -->
            <div class="deck-dock-buffer">
                <div class="expansion-deck">
                    <div class="expansion-controls"
                        style="display: flex; justify-content: space-between; align-items: center; width: 100%; box-sizing: border-box; padding: 4px 8px;">
                        <button class="control-btn" id="telemetryStreamBtn"
                            style="width: 48%; height: 32px; background: #222; color: #00ffcc; border: 1.5px solid #00ffcc; font-family: inherit; font-size: inherit; cursor: pointer;"
                            onclick="openChannelWindow('DASHBOARD')">TELEMETRY STREAM</button>
                        <button class="control-btn accent-btn" id="snapshotBtn"
                            style="width: 48%; height: 32px; background: #8b0000; color: #ffffff; border: 1px solid #ff4d4d; font-family: inherit; font-size: inherit; font-weight: bold; cursor: pointer; box-shadow: 0 0 8px rgba(139,0,0,0.4);">SNAPSHOT
                            BUNDLE</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="hud-top-right-container"
        style="position: absolute; top: 15px; right: 20px; z-index: 1000; display: flex; align-items: center; gap: 10px;">
        <button id="btn-test-suite-trigger" title="Launch Scientific Testing & Validation Drawer">
            🧪 Test & Validate
        </button>
    </div>

    <!-- 3D Gimbal Panel -->
    <div id="gimbal-hud"
        style="position: absolute; bottom: 20px; right: 20px; background: rgba(5, 5, 10, 0.95); border: 1px solid #00ffcc; padding: 12px; font-family: 'Courier New', monospace; color: #00ffcc; z-index: 100; font-size: 11px; width: 220px; box-shadow: 0 0 15px rgba(0,255,204,0.15);">
        <div
            style="margin-bottom: 8px; font-weight: bold; border-bottom: 1px solid #00ffcc55; padding-bottom: 4px; display: flex; justify-content: space-between;">
            <span>3D GIMBAL</span>
            <span onclick="window.resetCamera()" style="cursor:pointer; color:#ff0055;"
                title="Reset View">[RESET]</span>
        </div>
        <div style="text-align: center; background: #020205; border: 1px solid #00ffcc33; padding: 4px;">
            <canvas id="gizmoCanvas" width="192" height="100"
                style="cursor: grab; display: block; margin: 0 auto;"></canvas>
            <div style="font-size: 9px; color: #00ffcc88; margin-top: 2px;">Click & Drag to Orbit</div>
        </div>
    </div>

    <canvas id="hudCanvas"></canvas>
    <script type="module" src="/js/telemetryStream.js"></script>
    <script src="/js/snapshotEngine.js"></script>

    <!-- Unified 1:1 Pipeline Script -->
    <script type="module">
        import { ReferenceFrameManager } from '/physics/reference_frames.js';
        // import { initHUDRenderer, setRenderMode, resetRenderCamera } from '/js/hud_render.js';
        import { initHUDRenderer, setRenderMode, resetRenderCamera } from '/js/hud_render.js';

        const refSelect = document.getElementById('ref-frame-select');
            if (refSelect) {
                refSelect.addEventListener('change', (e) => {
                    e.stopImmediatePropagation();
                    window.setTopologyMode(e.target.value);
                }, true); // Capture phase intercepts before controlDeck.js
            }

        const frameManager = new ReferenceFrameManager();
        let userSelectedMode = 'open';

        window.hudConfig = window.hudConfig || {
            worldScale: parseFloat(document.getElementById('slider-world-scale')?.value || 1.0),
            gridDensity: 10,
            warpExaggeration: 1.0,
            motionSpeed: 1.0,
            noiseThresh: 0.05,
            overlayIntensity: 1.0,
            colorPalette: 'dynamic',
            streamFilter: 'all',
            interpolationMode: 'linear',
            showFloor: true,
            overlays: {}
        };

        // Initialize WebGL GPU Renderer first so window.hudViewport is guaranteed available
        const hudViewport = initHUDRenderer({
            canvas: document.getElementById('hudCanvas'),
            gizmoCanvas: document.getElementById('gizmoCanvas'),
            mode: 'open'
        });

        // Unified Property & Overlay State
        const activeOverlays = {
            qe: true,
            ads: true,
            snr: false,
            thermal: false,
            em: false,
            doppler: false,
            tension: true,
            vacuum: false,
            wave: false,
            emp: false,
            atmos: false,
            multipath: false
        };

        const schemaPropertyMap = {
            dynamic: { qe: true, ads: true, snr: false, thermal: false, em: false, doppler: false, tension: true, vacuum: false },
            qe: { qe: true, ads: false, snr: false, thermal: false, em: false, doppler: false, tension: false, vacuum: false },
            ads: { qe: false, ads: true, snr: false, thermal: false, em: false, doppler: false, tension: false, vacuum: false },
            snr: { qe: false, ads: false, snr: true, thermal: false, em: false, doppler: false, tension: false, vacuum: false },
            thermal: { qe: false, ads: false, snr: false, thermal: true, em: false, doppler: false, tension: false, vacuum: false },
            em: { qe: false, ads: false, snr: false, thermal: false, em: true, doppler: false, tension: false, vacuum: false },
            doppler: { qe: false, ads: false, snr: false, thermal: false, em: false, doppler: true, tension: false, vacuum: false },
            tension: { qe: false, ads: false, snr: false, thermal: false, em: false, doppler: false, tension: true, vacuum: false },
            vacuum: { qe: false, ads: false, snr: false, thermal: false, em: false, doppler: false, tension: false, vacuum: true },
            composite: { qe: true, ads: true, snr: true, thermal: true, em: true, doppler: true, tension: true, vacuum: true }
        };

        function syncOverlayButtons() {
            document.querySelectorAll('.overlay-toggle').forEach(btn => {
                const key = btn.getAttribute('data-overlay');
                if (key in activeOverlays) {
                    btn.classList.toggle('active', Boolean(activeOverlays[key]));
                }
            });
        }

        const paletteSelect = document.getElementById('palette-select');
            if (paletteSelect) {
                paletteSelect.addEventListener('change', (e) => {
                    const schema = e.target.value;
                    const mappedProps = schemaPropertyMap[schema] || schemaPropertyMap.dynamic;

                    Object.assign(activeOverlays, mappedProps);
                    syncOverlayButtons();

                    // Update global HUD config and viewport renderer
                    if (window.hudConfig) {
                        window.hudConfig.colorPalette = schema;
                        window.hudConfig.overlays = { ...activeOverlays };
                    }

                    if (hudViewport && typeof hudViewport.setColorPalette === 'function') {
                        hudViewport.setColorPalette(schema);
                        hudViewport.setOverlays({ ...activeOverlays });
                    }
                });
            }

        // Interference Overlays Toggle Buttons
            document.querySelectorAll('.overlay-toggle').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const targetBtn = e.currentTarget;
                    const key = targetBtn.getAttribute('data-overlay');
                    const isActive = targetBtn.classList.toggle('active');
                    activeOverlays[key] = isActive;

                    if (key === 'emp') activeOverlays.em = isActive;
                    if (key === 'wave') activeOverlays.qe = isActive;
                    if (key === 'atmos') activeOverlays.vacuum = isActive;
                    if (key === 'multipath') activeOverlays.snr = isActive;

                    // --- SPECIFIC PLACEMENT FOR THERMAL OVERLAY TOGGLE ---
                    if (key === 'thermal') {
                        if (typeof window.toggleThermalOverlay === 'function') {
                            window.toggleThermalOverlay(isActive);
                        }
                    }
                    // ----------------------------------------------------

                    hudViewport.setOverlays({ ...activeOverlays });
                });
            });

        // Stream Filter & Interpolation Mode Dropdowns
        const streamFilterSelect = document.getElementById('stream-filter-select');
        if (streamFilterSelect) {
            streamFilterSelect.addEventListener('change', (e) => {
                window.hudConfig.streamFilter = e.target.value;
            });
        }

        const interpSelect = document.getElementById('interpolation-select');
        if (interpSelect) {
            interpSelect.addEventListener('change', (e) => {
                window.hudConfig.interpolationMode = e.target.value;
            });
        }

        const floorCheckbox = document.getElementById('checkbox-floor');
        if (floorCheckbox) {
            floorCheckbox.addEventListener('change', (e) => {
                window.hudConfig.showFloor = e.target.checked;
            });
        }

        // 1:1 Bi-Directional Synchronization Bridge with Builder Deck (deck_render.js)
        let isHUDExternalSync = false;
        const mainHUDChannel = new BroadcastChannel('holographic_sync_channel');

        mainHUDChannel.onmessage = (event) => {
            const message = event.data;
            if (!message || !Array.isArray(message.nodes)) return;

            if (message.type === 'SYNC_FROM_BUILDER' || message.type === 'SYNC_TOPOLOGY') {
                isHUDExternalSync = true;
                const synchronizedNodes = [];

                for (const [index, n] of message.nodes.entries()) {
                    const posX = n.x !== undefined ? n.x : (n.position?.x || 0);
                    const posY = n.y !== undefined ? n.y : (n.position?.y || 0);
                    const posZ = n.z !== undefined ? n.z : (n.position?.z || 0);

                    synchronizedNodes.push({
                        id: n.id || `Q-00${index + 1}`,
                        name: n.label || n.name || `Qubit-${index + 1}`,
                        type: n.type || 'TOPOLOGY_NODE',
                        color: n.color || '#00ffcc',
                        x: posX,
                        y: posY,
                        z: posZ,
                        isPinned: true,
                        tier: n.tier || 'BOUNDARY',
                        data: n
                    });
                }

                window.nodes = synchronizedNodes;
                window.edges = message.edges || message.connections || [];

                setTimeout(() => { isHUDExternalSync = false; }, 50);
            }
        };

        window.broadcastHUDStateToBuilder = function (validNodes) {
            if (isHUDExternalSync) return;

            const payload = {
                type: 'SYNC_FROM_HUD',
                version: '3.0.0',
                timestamp: Date.now(),
                origin: 'MAIN_HUD',
                nodes: validNodes.map(n => ({
                    id: n.id,
                    name: n.name || n.id,
                    type: n.type || 'TOPOLOGY_NODE',
                    tier: n.tier || 'BOUNDARY',
                    x: n.x,
                    y: n.y,
                    z: n.z || 0,
                    color: n.color
                })),
                edges: (window.edges || []).map((e, idx) => ({
                    ...e,
                    index: idx,
                    source: String(e.source?.id || e.source || ''),
                    target: String(e.target?.id || e.target || '')
                }))
            };

            localStorage.setItem('holographic_latest_sync', JSON.stringify(payload));
            mainHUDChannel.postMessage(payload);
        };

        // JSON Import Handler (1:1 ingest into Main HUD & broadcast to Builder Deck)
        const importBtn = document.getElementById('import-json-btn');
        const jsonInput = document.getElementById('topologyJsonInput');
        if (importBtn && jsonInput) {
            importBtn.addEventListener('click', () => jsonInput.click());
            jsonInput.addEventListener('change', (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const parsed = JSON.parse(ev.target.result);
                        const rawNodes = parsed.nodes || parsed.vertices || [];
                        const rawEdges = parsed.edges || parsed.links || parsed.connections || [];

                        window.nodes = rawNodes.map((n, idx) => ({
                            id: n.id || `N-00${idx + 1}`,
                            name: n.name || n.label || n.id || `Node-${idx + 1}`,
                            type: n.type || 'TOPOLOGY_NODE',
                            tier: n.tier || 'BOUNDARY',
                            x: n.x !== undefined ? n.x : (n.position?.x || 0),
                            y: n.y !== undefined ? n.y : (n.position?.y || 0),
                            z: n.z !== undefined ? n.z : (n.position?.z || 0),
                            color: n.color || '#00ffcc',
                            isPinned: true,
                            data: n
                        }));
                        window.edges = rawEdges;

                        if (parsed.mode) {
                            window.setTopologyMode(parsed.mode);
                            const refSel = document.getElementById('ref-frame-select');
                            if (refSel) refSel.value = parsed.mode;
                        }

                        window.broadcastHUDStateToBuilder(window.nodes);
                    } catch (err) {
                        console.error('[JSON Import] Invalid topology JSON:', err);
                    }
                };
                reader.readAsText(file);
                jsonInput.value = '';
            });
        }

        // Default 3-node baseline synchronized with deck_render.js
        window.nodes = [
            { id: 'N-001', name: 'AdS Boundary Shell', type: 'TOPOLOGY', tier: 'BOUNDARY', x: 0, y: 0, z: 46, color: '#8b5cf6', isPinned: true },
            { id: 'N-002', name: 'Minkowski Space', type: 'METRIC', tier: 'BULK_CORE', x: -40, y: 0, z: -23, color: '#ffffff', isCore: true, isPinned: true },
            { id: 'N-003', name: 'Abelian U(1) EM', type: 'FIELD', tier: 'INTERMEDIATE', x: 40, y: 0, z: -23, color: '#10b981', isPinned: true }
        ];
        window.edges = [
            { source: 'N-001', target: 'N-002' },
            { source: 'N-001', target: 'N-003' },
            { source: 'N-002', target: 'N-003' }
        ];

        window.setTopologyMode = function (mode) {
            if (!mode) return;
            userSelectedMode = mode;
            console.log(`[TopologyMode] Setting mode to: "${mode}"`);
            // Normalize mode alias if needed (e.g. 'cubic' -> 'cubed')
            const normalizedMode = (mode === 'cubic') ? 'cubed' : mode;

            userSelectedMode = normalizedMode;
            window.hudMode = normalizedMode;

            console.log(`[TopologyMode] Setting mode to: "${normalizedMode}"`);
            try {
                const radius = 120.0;
                window.nodes.forEach((node, i) => {
                    if (mode === 'spheroid') {
                        const phi = Math.acos(1 - (2 * (i + 0.5)) / window.nodes.length);
                        const theta = Math.PI * (1 + Math.sqrt(5)) * i;
                        node.x = radius * Math.sin(phi) * Math.cos(theta);
                        node.y = radius * Math.cos(phi);
                        node.z = radius * Math.sin(phi) * Math.sin(theta);
                    } else if (mode === 'cubed' || mode === 'cubic') {
                        const half = radius * 0.6;
                        const c = i % 3;
                        node.x = (c === 0 ? (i % 2 === 0 ? half : -half) : (Math.random() - 0.5) * half);
                        node.y = (c === 1 ? (i % 2 === 0 ? half : -half) : (Math.random() - 0.5) * half);
                        node.z = (c === 2 ? (i % 2 === 0 ? half : -half) : (Math.random() - 0.5) * half);
                    } else if (mode === 'toroidal') {
                        const R = radius * 0.8;
                        const r = radius * 0.3;
                        const u = (i / window.nodes.length) * Math.PI * 2;
                        const v = i * 2.4;
                        node.x = (R + r * Math.cos(v)) * Math.cos(u);
                        node.y = r * Math.sin(v);
                        node.z = (R + r * Math.cos(v)) * Math.sin(u);
                    } else if (mode === 'hyperbolic') {
                        const u = ((i / window.nodes.length) - 0.5) * 4.0;
                        const v = (i * 1.5) % (Math.PI * 2);
                        const flare = Math.cosh(u);
                        node.x = radius * 0.5 * flare * Math.cos(v);
                        node.y = u * 45.0;
                        node.z = radius * 0.5 * flare * Math.sin(v);
                    } else if (mode === 'open') {
                        const angleStep = (Math.PI * 2) / Math.max(1, window.nodes.length - 1);
                        if (node.isCore || node.tier === 'BULK_CORE') {
                            node.x = 0; node.y = 0; node.z = 0;
                        } else {
                            const idx = i % Math.max(1, window.nodes.length - 1);
                            node.x = Math.cos(idx * angleStep) * 60;
                            node.y = 0;
                            node.z = Math.sin(idx * angleStep) * 60;
                        }
                    } else {
                        console.warn(`[TopologyMode] UNKNOWN mode received: "${mode}". Defaulting node positions to origin.`);
                    }
                    node.isPinned = true;
                });

                setRenderMode(normalizedMode);
                // Sync the dropdown value if called programmatically
        const refSel = document.getElementById('ref-frame-select');
        if (refSel && refSel.value !== normalizedMode) {
            refSel.value = normalizedMode;
        }

                window.broadcastHUDStateToBuilder(window.nodes);
            } catch (err) {
                console.error(`[TopologyMode] EXCEPTION while setting mode "${mode}":`, err);
            }
        };

        window.resetCamera = function () {
            resetRenderCamera();
        };

        // Tensegrity equilibrium update step
        window.hudPhysicsStep = function () {
            if (!window.nodes) return;
            const dt = 0.016;
            const damping = 0.90;

            window.nodes.forEach((node) => {
                if (node.vx === undefined) { node.vx = 0; node.vy = 0; node.vz = 0; }
                if (node.isPinned || node === window.selectedNode) {
                    node.fx = 0; node.fy = 0; node.fz = 0;
                    return;
                }
                node.fx = 0; node.fy = 0; node.fz = 0;

                if (node.targetX !== undefined) {
                    node.fx += (node.targetX - node.x) * 8.0;
                    node.fy += (node.targetY - node.y) * 8.0;
                    node.fz += (node.targetZ - node.z) * 8.0;
                }

                node.vx = (node.vx + (node.fx / (node.mass || 1.0)) * dt) * damping;
                node.vy = (node.vy + (node.fy / (node.mass || 1.0)) * dt) * damping;
                node.vz = (node.vz + (node.fz / (node.mass || 1.0)) * dt) * damping;

                node.x += node.vx * dt;
                node.y += node.vy * dt;
                node.z += node.vz * dt;
            });
        };

        // Sliders binding
        const bindSlider = (id, valId, unit = '') => {
            const slider = document.getElementById(id);
            const valDisplay = document.getElementById(valId);
            if (slider && valDisplay) {
                slider.addEventListener('input', (e) => {
                    const val = parseFloat(e.target.value);
                    valDisplay.textContent = e.target.value + unit;
                    if (window.hudConfig) {
                        if (id === 'slider-world-scale') {
                            window.hudConfig.worldScale = val;

                            // 1. Scale our modular reference frame topology
                            if (window.referenceFrameManager && typeof window.referenceFrameManager.setScale === 'function') {
                                window.referenceFrameManager.setScale(val);
                            }

                            // 2. Scale shader uniforms / viewport renderer components
                            if (hudViewport && typeof hudViewport.setWorldScale === 'function') {
                                hudViewport.setWorldScale(val);
                            }
                        }
                        if (id === 'slider-grid-density') { window.hudConfig.gridDensity = val; window.hudConfig.warpExaggeration = val / 10.0; }
                        if (id === 'slider-motion-speed') window.hudConfig.motionSpeed = val;
                        if (id === 'slider-noise-thresh') window.hudConfig.noiseThresh = val;
                        if (id === 'slider-overlay-intensity') window.hudConfig.overlayIntensity = val;
                    }
                });
            }
        };

        bindSlider('slider-world-scale', 'val-world-scale');
        bindSlider('slider-grid-density', 'val-grid-density');
        bindSlider('slider-motion-speed', 'val-motion-speed', 'x');
        bindSlider('slider-noise-thresh', 'val-noise-thresh');
        bindSlider('slider-overlay-intensity', 'val-overlay-intensity', 'x');

        syncOverlayButtons();
    </script>
