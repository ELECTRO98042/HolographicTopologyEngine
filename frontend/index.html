        // 3D Projection Pipeline[cite: 1]
        function project3D(x, y, z, width, height) {
            const cx = x;
            const cy = y;
            const cz = z || 0.0;

            const cosY = Math.cos(camera.rotY), sinY = Math.sin(camera.rotY);
            const x1 = cx * cosY - cz * sinY;
            const z1 = cx * sinY + cz * cosY;

            const cosX = Math.cos(camera.rotX), sinX = Math.sin(camera.rotX);
            const y1 = cy * cosX - z1 * sinX;
            const z2 = cy * sinX + z1 * cosX;

            const cosZ = Math.cos(camera.rotZ), sinZ = Math.sin(camera.rotZ);
            const x2 = x1 * cosZ - y1 * sinZ;
            const y2 = x1 * sinZ + y1 * cosZ;

            const fov = camera.distance;
            const scale = fov / (fov + z2 + 300);

            return {
                px: width / 2 + x2 * scale,
                py: height / 2 + y2 * scale,
                scale: scale,
                depth: z2
            };
        }

        // Topology Preset Generator[cite: 1]
        window.setTopologyMode = function (mode) {
                const count = window.nodes.length > 0 ? window.nodes.length : 8;
                const newNodes = []; // Use a local array first

                for (let i = 0; i < count; i++) {
                    let x = 0, y = 0, z = 0;
                    const id = `N-00${i + 1}`;
                    const isCore = (i === 0);

                    if (mode === 'spheroid') {
                        const phi = Math.acos(-1 + (2 * i) / count);
                        const theta = Math.sqrt(count * Math.PI) * phi;
                        const r = 120;
                        x = r * Math.cos(theta) * Math.sin(phi);
                        y = r * Math.sin(theta) * Math.sin(phi);
                        z = r * Math.cos(phi);
                    } else if (mode === 'cubed') {
                        const spacing = 100;
                        x = (i % 2 === 0 ? -1 : 1) * spacing;
                        y = (Math.floor(i / 2) % 2 === 0 ? -1 : 1) * spacing;
                        z = (Math.floor(i / 4) === 0 ? -1 : 1) * spacing;
                    } else if (mode === 'toroidal') {
                        const R = 120, r = 40;
                        const u = (i / count) * Math.PI * 2;
                        const v = (i * 3) * Math.PI * 2 / count;
                        x = (R + r * Math.cos(v)) * Math.cos(u);
                        y = (R + r * Math.cos(v)) * Math.sin(u);
                        z = r * Math.sin(v);
                    } else {
                        x = (Math.random() - 0.5) * 300;
                        y = (Math.random() - 0.5) * 300;
                        z = (Math.random() - 0.5) * 150;
                    }

                    newNodes.push({ id, x, y, z, isCore });
                }
                window.nodes = newNodes;
                _fallbackNodes = newNodes;
            };

        // Reset Camera Handler[cite: 1]
        window.resetCamera = function () {
            camera.rotX = 0.3;
            camera.rotY = 0.0;
            camera.rotZ = 0.0;
        };

        // Interactive Gizmo Handle Logic[cite: 1]
        const gizmoCanvas = document.getElementById('gizmoCanvas');
        gizmoCanvas.width = 192;
        gizmoCanvas.height = 100;
        const gCtx = gizmoCanvas.getContext('2d');
        let isGizmoDragging = false;
        let gizmoLastX = 0;
        let gizmoLastY = 0;

        gizmoCanvas.addEventListener('mousedown', (e) => {
            isGizmoDragging = true;
            gizmoLastX = e.clientX;
            gizmoLastY = e.clientY;
            gizmoCanvas.style.cursor = 'grabbing';
        });

        window.addEventListener('mousemove', (e) => {
            if (!isGizmoDragging) return;
            const deltaX = e.clientX - gizmoLastX;
            const deltaY = e.clientY - gizmoLastY;

            camera.rotY += deltaX * 0.02;
            camera.rotX += deltaY * 0.02;
            camera.rotX = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, camera.rotX));

            gizmoLastX = e.clientX;
            gizmoLastY = e.clientY;
        });

        // Render Gizmo Triad[cite: 1]
        function drawGizmo() {
            gCtx.fillStyle = '#020205';
            gCtx.fillRect(0, 0, gizmoCanvas.width, gizmoCanvas.height);

            const cx = gizmoCanvas.width / 2;
            const cy = gizmoCanvas.height / 2;
            const len = 35;

            const axes = [
                { label: 'X', x: len, y: 0, z: 0, color: '#ff0055' },
                { label: 'Y', x: 0, y: len, z: 0, color: '#00ffcc' },
                { label: 'Z', x: 0, y: 0, z: len, color: '#0066ff' }
            ];

            axes.forEach(axis => {
                const cosY = Math.cos(camera.rotY), sinY = Math.sin(camera.rotY);
                const cosX = Math.cos(camera.rotX), sinX = Math.sin(camera.rotX);
                const cosZ = Math.cos(camera.rotZ), sinZ = Math.sin(camera.rotZ);

                let x1 = axis.x * cosY - axis.z * sinY;
                let z1 = axis.x * sinY + axis.z * cosY;
                let y1 = axis.y * cosX - z1 * sinX;
                let x2 = x1 * cosZ - y1 * sinZ;
                let y2 = x1 * sinZ + y1 * cosZ;

                gCtx.strokeStyle = axis.color;
                gCtx.lineWidth = 2;
                gCtx.beginPath();
                gCtx.moveTo(cx, cy);
                gCtx.lineTo(cx + x2, cy + y2);
                gCtx.stroke();

                gCtx.fillStyle = '#ffffff';
                gCtx.font = '9px Courier New';
                gCtx.fillText(axis.label, cx + x2 + 3, cy + y2 + 3);
            });
        }

        function updateHUD(packet) {

            const eeEl = document.querySelector('.hud-ee');

            if (integrityEl) integrityEl.textContent = `System Integrity: ${packet.integrity}%`;
            if (eeEl) eeEl.textContent = `Entanglement (See): ${packet.s_ee}`;
            if (phiEl) phiEl.textContent = `Integrated Info (Phi): ${packet.phi}`;

            // Global Interaction State[cite: 1]

            function isInGimbalArea(x, y) {

            // Multi-Tier Spectral EM Shells (Concentric Spin Network Loop Lattice with Proximity)
                function drawSpectralOrbs(scaleMultiplier) {
                    const spectralTiers = [
                        { radius: 30, color: 'rgba(255, 255, 255, 0.22)', width: 1.0 }, // Core: Planck / White Hot Singularity
                        { radius: 65, color: 'rgba(250, 204, 21, 0.25)', width: 0.9 }, // Tier 1: UV / Yellow High-Freq

                        { radius: 240, color: 'rgba(59, 130, 246, 0.15)', width: 0.6 }  // Tier 5: Radio / Asymptotic Blue Horizon
                    ];

                    const timeNow = performance.now();

                    });
                }

                // Concentric Spin Network Loop Lattice Renderer with Proximity Patch Illumination
                    function drawSpinNetworkShell(radius, baseStroke, lineWidth, timeFactor, warpExaggeration = 1.0) {
                            const latSteps = 36; // Increased resolution
                            const lonSteps = 72;
                            const interactionRadius = 55;
                            // FIXED: Reassign from window.hudConfig if available, otherwise use function parameter default
                            const currentWarp = window.hudConfig && window.hudConfig.warpExaggeration !== undefined
                                ? window.hudConfig.warpExaggeration
                                : warpExaggeration;

                            for (let i = 1; i < latSteps; i++) {
                                const lat = (Math.PI / latSteps) * i - Math.PI / 2;

                                let segmentPoints = [];
                                for (let j = 0; j <= lonSteps; j++) {
                                    const lon = (Math.PI * 2 / lonSteps) * j;

                                    // Complex dual-frequency harmonic modulation for intricate loop lattice weave
                                    const harmonicMod = (Math.sin(lon * 6 + (timeFactor || 0) * 0.003) * 1.8) +
                                        (Math.cos(lat * 4 - (timeFactor || 0) * 0.002) * 1.2);

                                    let rMod = radius + harmonicMod;

                                    // Curvature mesh warping driven by cumulative node proximity & mass
                                    if (window.nodes) {
                                        for (const node of window.nodes) {
                                            const nx = node.x || 0;
                                            const ny = node.y || 0;
                                            const nz = node.z || 0;

                                            const baseShellX = rMod * Math.cos(lat) * Math.cos(lon);
                                            const baseShellY = rMod * Math.sin(lat);
                                            const baseShellZ = rMod * Math.cos(lat) * Math.sin(lon);

                                            const dist = Math.sqrt((baseShellX - nx) ** 2 + (baseShellY - ny) ** 2 + (baseShellZ - nz) ** 2);
                                            if (dist < 120 && dist > 0) {
                                                // Rubber-sheet gravitational depression/bulge scaled by warpExaggeration slider
                                                const warpForce = ((120 - dist) / 120) * 8.0 * warpExaggeration;
                                                rMod += warpForce;
                                            }
                                        }
                                    }

                                    const x = rMod * Math.cos(lat) * Math.cos(lon);
                                    const y = rMod * Math.sin(lat);
                                    const z = rMod * Math.cos(lat) * Math.sin(lon);

                                    // Check distance for local highlight illumination
                                    let isNearNode = false;
                                    if (window.nodes) {
                                        for (const node of window.nodes) {
                                            const dist = Math.sqrt((x - (node.x || 0)) ** 2 + (y - (node.y || 0)) ** 2 + (z - (node.z || 0)) ** 2);
                                            if (dist < interactionRadius) {
                                                isNearNode = true;
                                                break;
                                            }
                                        }
                                    }

                                    const p = project3D(x, y, z, canvas.width, canvas.height);
                                    segmentPoints.push({ ...p, isHighlighted: isNearNode });
                                }

                                for (let j = 0; j < segmentPoints.length - 1; j++) {
                                    const p1 = segmentPoints[j];
                                    const p2 = segmentPoints[j + 1];

                                    if (p1.scale > 0 && p2.scale > 0) {
                                        ctx.beginPath();
                                        ctx.moveTo(p1.px, p1.py);
                                        ctx.lineTo(p2.px, p2.py);

                                        if (p1.isHighlighted || p2.isHighlighted) {
                                            ctx.strokeStyle = 'rgba(255, 255, 255, 0.40)';
                                            ctx.lineWidth = (lineWidth || 0.6) * 1.3;
                                        } else {
                                            ctx.strokeStyle = baseStroke;
                                            ctx.lineWidth = lineWidth || 0.6;
                                        }
                                        ctx.stroke();
                                    }
                                }
                            }
                        }

                    // Tension-Driven Vibrating Tether Renderer
                    function drawVibratingTether(p1, p2, rawDist, timeValue) {
                        if (p1.scale <= 0 || p2.scale <= 0) return;

                        const dx = p2.px - p1.px;
                        const dy = p2.py - p1.py;
                        const length = Math.sqrt(dx * dx + dy * dy);
                        if (length < 2) return;

                        // Derive tension from deviation against an ideal rest distance (~90 units)
                        const restDist = 90.0;
                        const tension = Math.min(1.0, Math.abs(rawDist - restDist) / restDist);

                        const frequency = 6.0; // Number of standing wave nodes
                        const maxAmplitude = 7.0 * tension; // Higher tension = more visible string vibration

                        ctx.beginPath();
                        ctx.moveTo(p1.px, p1.py);

                        const segments = 18;
                        const nx = -dy / length; // Perpendicular normal X
                        const ny = dx / length;  // Perpendicular normal Y

                        for (let s = 1; s < segments; s++) {
                            const t = s / segments;
                            const baseX = p1.px + dx * t;
                            const baseY = p1.py + dy * t;

                            const envelope = Math.sin(t * Math.PI);
                            const wave = Math.sin(t * Math.PI * frequency + (timeValue || 0) * 0.015) * maxAmplitude * envelope;

                            const vx = baseX + nx * wave;
                            const vy = baseY + ny * wave;

                            ctx.lineTo(vx, vy);
                        }

                        ctx.lineTo(p2.px, p2.py);

                        // Thermal color shift under high mechanical load
                        if (tension > 0.55) {
                            ctx.strokeStyle = 'rgba(255, 140, 0, 0.85)'; // High-stress amber alert pulse
                            ctx.lineWidth = 1.8 * Math.min(p1.scale, p2.scale);
                        } else {
                            ctx.strokeStyle = 'rgba(6, 182, 212, 0.65)'; // Standard cyan flux line
                            ctx.lineWidth = (0.8 + (tension * 0.8)) * Math.min(p1.scale, p2.scale);
                        }
                        ctx.stroke();
                    }

            // Localized Mesh Patch Illumination Helper
                function drawConcentricShellWithProximity(radius, baseStroke, lineWidth) {
                    const latSteps = 32;
                    const lonSteps = 64;
                    const interactionRadius = 55; // Proximity threshold in world units

                    for (let i = 1; i < latSteps; i++) {
                        const lat = (Math.PI / latSteps) * i - Math.PI / 2;
                        const rCurrent = radius * Math.cos(lat);
                        const yCurrent = radius * Math.sin(lat);

                                    }
                                }
                            }

                function updateTensegrityEquilibrium() {
                        if (!window.nodes) return;

                        const dt = 0.016;       // Fixed timestep (60 FPS baseline)
                        const damping = 0.90;    // Friction / velocity dampening

                        window.nodes.forEach((node, idx) => {
                            if (node.isPinned || node === selectedNode) return;

                            // Initialize velocity and clear accumulated forces
                            if (node.vx === undefined) { node.vx = 0; node.vy = 0; node.vz = 0; }
                            node.fx = 0; node.fy = 0; node.fz = 0;

                            // A. Target Shell Restoration Force (Bulk-Boundary Tiers)
                            let targetRadius = 105;
                            if (node.tier === 'BULK_CORE' || node.isCore) targetRadius = 30;
                            else if (node.tier === 'BOUNDARY') targetRadius = 190;

                            const currentRadius = Math.sqrt(node.x ** 2 + node.y ** 2 + node.z ** 2) || 1;
                            const radialError = targetRadius - currentRadius;
                            const springK = 12.0;

                            node.fx += (node.x / currentRadius) * radialError * springK;
                            node.fy += (node.y / currentRadius) * radialError * springK;
                            node.fz += (node.z / currentRadius) * radialError * springK;

                            // B. Telemetry Stream Attractor Force
                            if (node.targetX !== undefined) {
                                const streamPull = 5.0;
                                node.fx += (node.targetX - node.x) * streamPull;
                                node.fy += (node.targetY - node.y) * streamPull;
                                node.fz += (node.targetZ - node.z) * streamPull;
                            }

                            // C. Inter-Node Electrostatic Repulsion
                            for (let j = 0; j < window.nodes.length; j++) {
                                if (idx === j) continue;
                                const other = window.nodes[j];
                                const dx = other.x - node.x;
                                const dy = other.y - node.y;
                                const dz = other.z - node.z;
                                const dist = Math.sqrt(dx * dx + dy * dy + dz * dz) || 0.001;

                                if (dist < 50) {
                                    const repulsion = (50 - dist) * 10.0;
                                    node.fx -= (dx / dist) * repulsion;
                                    node.fy -= (dy / dist) * repulsion;
                                    node.fz -= (dz / dist) * repulsion;
                                }
                            }

                            // D. Velocity-Verlet Integration (Sole Authority modifying node coordinates)
                            const mass = node.mass || 1.0;
                            node.vx = (node.vx + (node.fx / mass) * dt) * damping;
                            node.vy = (node.vy + (node.fy / mass) * dt) * damping;
                            node.vz = (node.vz + (node.fz / mass) * dt) * damping;

                            node.x += node.vx * dt;
                            node.y += node.vy * dt;
                            node.z += node.vz * dt;
                        });
                    }
                    

            // Main Concentric Render Loop (Blueprint 1: Epistemic Topology Canvas)
            function draw() {
                // 1. Run the Tensegrity Equilibrium relaxation step per frame
                updateTensegrityEquilibrium();
                ctx.fillStyle = '#05050a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                const scaleMultiplier = window.hudConfig ? window.hudConfig.worldScale : 1.0;

                // 1. Interference Overlays (Preserved directly from original HUD deck)

                    const gradient = ctx.createRadialGradient(

                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.restore();
                }

                if (overlays.wave) {
                    ctx.save();
                    ctx.strokeStyle = 'rgba(0, 255, 204, 0.08)';
                    ctx.lineWidth = 1;
                    const timeVal = performance.now() * 0.002;
                    for (let y = 0; y < canvas.height; y += 12) {
                        ctx.beginPath();
                        ctx.moveTo(0, y);
                        for (let x = 0; x < canvas.width; x += 20) {

                            ctx.lineTo(x, waveY);
                        }
                        ctx.stroke();
                    }
                    ctx.restore();
                }

                if (overlays.atmos) {
                    ctx.save();
                    ctx.fillStyle = 'rgba(0, 255, 150, 0.03)';
                    const scanlineY = (performance.now() * 0.1) % canvas.height;
                    ctx.fillRect(0, scanlineY, canvas.width, 3);
                    ctx.restore();
                }

                // 2. World-Space Floor Grid (Preserved)
                ctx.strokeStyle = 'rgba(0, 255, 204, 0.15)';
                ctx.lineWidth = 1;
                for (let i = -gridSteps; i <= gridSteps; i++) {
                    const coord = (i / gridSteps) * span;
                    const p1 = project3D(coord, floorY, -span, canvas.width, canvas.height);
                    const p2 = project3D(coord, floorY, span, canvas.width, canvas.height);
                    if (p1.scale > 0 && p2.scale > 0) {
                        ctx.beginPath(); ctx.moveTo(p1.px, p1.py); ctx.lineTo(p2.px, p2.py); ctx.stroke();
                    }
                    const p3 = project3D(-span, floorY, coord, canvas.width, canvas.height);
                    const p4 = project3D(span, floorY, coord, canvas.width, canvas.height);
                    if (p3.scale > 0 && p4.scale > 0) {
                        ctx.beginPath(); ctx.moveTo(p3.px, p3.py); ctx.lineTo(p4.px, p4.py); ctx.stroke();
                    }
                }

                // 3. Render Concentric Bulk-Boundary Shells (Blueprint 1 Master Geometric Framework) Invokes the full 6-tier spectral EM legend with longitude/latitude meshes):
                drawSpectralOrbs(scaleMultiplier);

                // 4. Project Nodes into 3D Space
                let projectedNodes = nodes.map(node => {
                    const pos = node.position || node;
                    const baseSpread = 1.0;
                    const effectiveScale = baseSpread * scaleMultiplier;

                    const p = project3D(pos.x * effectiveScale, pos.y * effectiveScale, pos.z * effectiveScale, canvas.width, canvas.height);
                    return { ...node, px: p.px, py: p.py, scale: p.scale, depth: p.depth };
                });

                // 5. Tension-Driven Vibrating Tethers Connecting Nodes
                const timeVal = performance.now();
                for (let i = 0; i < projectedNodes.length; i++) {
                    for (let j = i + 1; j < projectedNodes.length; j++) {
                        const n1 = projectedNodes[i];
                        const n2 = projectedNodes[j];

                        const rawDist = Math.sqrt(
                            (n1.x - n2.x) ** 2 +
                            (n1.y - n2.y) ** 2 +
                            (n1.z - n2.z) ** 2
                        );

                        drawVibratingTether(n1, n2, rawDist, timeVal);
                    }
                }

                // 6. Node Spheres & High-Glow Core Anchors
                projectedNodes.forEach(node => {
                    if (node.scale <= 0) return;
                    const identifier = (node.data && node.data.name) ? node.data.name : (node.id || 'N-001');
                    const isCore = node.tier === 'BULK_CORE' || node.isCore;
                    const nodeColor = node.color || (isCore ? '#ffffff' : '#10b981');

                    ctx.save();
                    ctx.fillStyle = nodeColor;
                    ctx.shadowColor = nodeColor;
                    ctx.shadowBlur = isCore ? 18 : 8;

                    ctx.beginPath();
                    ctx.arc(node.px, node.py, (isCore ? 7 : 4.5) * node.scale, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();

                    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                    ctx.font = '10px Courier New';
                    ctx.fillText(identifier, node.px + 10, node.py + 4);
                });

                // 7. Interactive 3D Gimbal Panel Render (Preserved)
                drawGizmo();
            }
