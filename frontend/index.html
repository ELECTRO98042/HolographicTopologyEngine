<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Holographic Topology Engine HUD v2.6.9</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            margin: 0;
            background-color: #05050a;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        #hud-container {
            position: absolute;
            top: 20px;
            left: 20px;
            height: auto;
            width: 320px;
            background: rgba(5, 5, 10, 0.85);
            border: 1px solid #00ffcc;
            padding: 15px;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            pointer-events: none;
            z-index: 100;
        }

        h3 {
            font-size: 16px;
            margin: 0 0 10px 0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .hud-integrity,
        .hud-ee,
        .hud-phi {
            font-size: 14px;
            margin: 5px 0;
        }

        .metric-value {
            color: #ff0055;
            font-weight: bold;
        }

        canvas {
            display: block;
        }

        /* Spatial Control Deck Styling (v2.6.8) */
        #spatial-control-deck {
            position: absolute;
            top: 145px;
            left: 20px;
            width: 300px;
            background: rgba(5, 5, 10, 0.95);
            border: 1px solid #00ffcc;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            color: #00ffcc;
            z-index: 100;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.15);
            font-size: 11px;
            pointer-events: auto; /* <--- Add this line */
        }

        .deck-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(0, 255, 204, 0.1);
            border-bottom: 1px solid rgba(0, 255, 204, 0.3);
        }

        .deck-header h3 {
            margin: 0;
            font-size: 12px;
            letter-spacing: 1px;
        }

        #deck-collapse-btn {
            background: transparent;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            cursor: pointer;
            width: 18px;
            height: 18px;
            font-weight: bold;
            line-height: 14px;
            text-align: center;
        }

        .deck-body {
            padding: 10px 12px;
            max-height: 75vh;
            overflow-y: auto;
        }

        .deck-section {
            margin-bottom: 8px;
        }

        .control-field {
            margin-bottom: 6px;
        }

        .control-field label,
        .section-label,
        .slider-group label {
            display: block;
            font-size: 10px;
            text-transform: uppercase;
            color: #00ffccaa;
            margin-bottom: 2px;
        }

        .control-field select {
            width: 100%;
            background: #05050a;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 5px;
            font-family: inherit;
            font-size: 10px;
            border-radius: 2px;
            cursor: pointer;
        }

        .deck-divider {
            border: none;
            border-top: 1px solid rgba(0, 255, 204, 0.2);
            margin: 8px 0;
        }

        .slider-group {
            margin-bottom: 6px;
        }

        .slider-label-row {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #00ffccaa;
            margin-bottom: 2px;
        }

        .slider-group input[type="range"] {
            width: 100%;
            accent-color: #00ffcc;
            background: transparent;
            cursor: pointer;
        }

        .overlay-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
        }

        .overlay-toggle {
            background: rgba(5, 5, 10, 0.8);
            border: 1px solid rgba(0, 255, 204, 0.4);
            color: #00ffcc;
            font-size: 9px;
            padding: 5px 2px;
            cursor: pointer;
            text-align: center;
            border-radius: 2px;
            font-family: inherit;
            transition: all 0.2s ease;
            pointer-events: auto; /* <--- Add this line */
        }

        .overlay-toggle.active {
            background: rgba(0, 255, 204, 0.3);
            border-color: #00ffcc;
            color: #fff;
            box-shadow: 0 0 5px rgba(0, 255, 204, 0.5);
        }

        .action-matrix {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .button-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
        }

        .action-btn {
            background: rgba(0, 255, 204, 0.08);
            border: 1px solid rgba(0, 255, 204, 0.4);
            color: #00ffcc;
            font-family: inherit;
            font-size: 9px;
            padding: 5px 2px;
            cursor: pointer;
            text-align: center;
            border-radius: 2px;
            text-transform: uppercase;
        }

        .action-btn:hover {
            background: rgba(0, 255, 204, 0.25);
            border-color: #00ffcc;
        }

        .deck-dock-buffer {
            margin-top: 8px;
            padding: 5px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed rgba(0, 255, 204, 0.2);
            text-align: center;
        }

        .buffer-text {
            font-size: 9px;
            color: #00ffcc66;
            letter-spacing: 0.5px;
        }
    </style>
    <link rel="stylesheet" href="css/testingSuite.css">
</head>

<body>
    <!-- Primary Telemetry HUD -->
    <div id="hud-container" style="width: 299px;">
        <h3>HOLOGRAPHIC HUD V2.6.8</h3>
        <div class="hud-integrity">System Integrity: 100%</div>
        <div class="hud-ee">Entanglement (See): 0.0</div>
        <div class="hud-phi">Integrated Info (Phi): 0.0</div>
    </div>

    <!-- Spatial Control Deck -->
    <div id="spatial-control-deck">
        <div class="deck-header">
            <h3>Spatial Control Deck</h3>
            <button id="deck-collapse-btn" title="Toggle Deck">−</button>
        </div>

        <div class="deck-body" id="deck-body-content">
            <!-- 1. Spatial & Visual Reference -->
            <div class="deck-section">
                <div class="control-field">
                    <label>Reference Frame</label>
                    <select id="ref-frame-select"
                        onchange="window.setTopologyMode(this.value); event.stopPropagation();">
                        <option value="open">Open Space (Default)</option>
                        <option value="spheroid">Spheroid</option>
                        <option value="cubed">Cubed</option>
                        <option value="toroidal">Toroidal</option>
                        <option value="hyperbolic">Hyperbolic</option>
                    </select>
                </div>

                <div class="control-field">
                    <label>Telemetry Stream Filter</label>
                    <select id="stream-filter-select">
                        <option value="all">All Channels (Active)</option>
                        <option value="primary">Primary Array Only</option>
                        <option value="anomaly">Anomaly Filtered</option>
                    </select>
                </div>

                <div class="control-field">
                    <label>Data Interpolation Mode</label>
                    <select id="interpolation-select">
                        <option value="linear">Linear</option>
                        <option value="spline">Spline</option>
                        <option value="discrete">Discrete Step</option>
                    </select>
                </div>

                <div class="control-field">
                    <label>Color Palette / Schema</label>
                    <select id="palette-select">
                        <option value="dynamic">Dynamic (default)</option>
                        <option value="thermal">Thermal Dispersion</option>
                        <option value="scifi">Quantum Entanglement</option>
                        <option value="monochrome">Signal Integrity (SNR)</option>
                        <option value="multispectral">TD / QE / SNR Composite</option>
                    </select>
                </div>
            </div>

            <hr class="deck-divider">

            <!-- 2. Dynamic Scaling & Operations -->
            <div class="deck-section">
                <div class="slider-group">
                    <div class="slider-label-row" style="align-items: center;">
                        <label>World Scale / Extent</label>
                        <div style="display: flex; align-items: center; gap: 6px;">
                            <label style="font-size: 8px; color: #00ffccaa; cursor: pointer;" for="checkbox-floor">Floor
                                On</label>
                            <input type="checkbox" id="checkbox-floor" checked
                                style="accent-color: #00ffcc; cursor: pointer; transform: scale(0.8);">
                            <span id="val-world-scale">1.0</span>
                        </div>
                    </div>
                    <input type="range" id="slider-world-scale" min="0.5" max="3.0" step="0.1" value="1.0">
                </div>

                <div class="slider-group">
                    <div class="slider-label-row">
                        <label>Grid Resolution / Density</label>
                        <span id="val-grid-density">10</span>
                    </div>
                    <input type="range" id="slider-grid-density" min="5" max="30" step="1" value="10">
                </div>

                <div class="slider-group">
                    <div class="slider-label-row">
                        <label>Temporal Motion Speed</label>
                        <span id="val-motion-speed">1.0x</span>
                    </div>
                    <input type="range" id="slider-motion-speed" min="0.0" max="5.0" step="0.1" value="1.0">
                </div>

                <div class="slider-group">
                    <div class="slider-label-row">
                        <label>Signal Noise Threshold</label>
                        <span id="val-noise-thresh">0.05</span>
                    </div>
                    <input type="range" id="slider-noise-thresh" min="0.0" max="0.5" step="0.01" value="0.05">
                </div>

                <div class="slider-group">
                    <div class="slider-label-row">
                        <label>Diagnostic Overlay Luminosity</label>
                        <span id="val-overlay-intensity">1.0x</span>
                    </div>
                    <input type="range" id="slider-overlay-intensity" min="0.1" max="3.0" step="0.1" value="1.0">
                </div>
            </div>

            <hr class="deck-divider">

            <!-- 3. Signal Stress Testing -->
            <div class="deck-section">
                <label class="section-label">Interference Overlays</label>
                <div class="overlay-grid">
                    <button class="overlay-toggle" data-overlay="thermal">Thermal</button>
                    <button class="overlay-toggle" data-overlay="wave">Wave Interf.</button>
                    <button class="overlay-toggle" data-overlay="emp">EMP Dist.</button>
                    <button class="overlay-toggle" data-overlay="atmos">Atmospheric</button>
                    <button class="overlay-toggle" data-overlay="doppler">Doppler</button>
                    <button class="overlay-toggle" data-overlay="multipath">Multipath</button>
                </div>
            </div>

            <hr class="deck-divider">

            <!-- 4. Data Persistence & State Control -->
            <div class="deck-section action-matrix">
                <div class="button-group export-group">
                    <button id="btn-export-json" class="action-btn">JSON Config</button>
                    <button id="btn-export-csv" class="action-btn">CSV Data</button>
                    <button id="btn-export-dot" class="action-btn">DOT Graph</button>
                </div>
                <div class="button-group state-group">
                    <button id="btn-pin-all" class="action-btn">Pin All</button>
                    <button id="btn-release-all" class="action-btn">Release All</button>
                    <button id="btn-reset-view" class="action-btn" onclick="window.resetCamera()">Reset View</button>
                </div>
            </div>

            <!-- 5. Expansion Buffer -->
            <div class="deck-dock-buffer">
                <div class="expansion-deck">
                    <div class="expansion-controls"
                        style="display: flex; justify-content: space-between; align-items: center; width: 100%; box-sizing: border-box; padding: 4px 8px;">
                        <button class="control-btn" id="telemetryStreamBtn"
                            style="width: 48%; height: 32px; background: #222; color: #00ffcc; border: 1.5px solid #00ffcc; font-family: inherit; font-size: inherit; cursor: pointer;"
                            onclick="openChannelWindow('DASHBOARD')">TELEMETRY STREAM</button>
                        <button class="control-btn accent-btn" id="snapshotBtn"
                            style="width: 48%; height: 32px; background: #8b0000; color: #ffffff; border: 1px solid #ff4d4d; font-family: inherit; font-size: inherit; font-weight: bold; cursor: pointer; box-shadow: 0 0 8px rgba(139,0,0,0.4);">SNAPSHOT
                            BUNDLE</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="hud-top-right-container"
        style="position: absolute; top: 15px; right: 20px; z-index: 1000; display: flex; align-items: center; gap: 10px;">
        <button id="btn-test-suite-trigger" title="Launch Scientific Testing & Validation Drawer">
            🧪 Test & Validate
        </button>
    </div>

    <!-- 3D Gimbal Panel -->
    <div id="gimbal-hud"
        style="position: absolute; bottom: 20px; right: 20px; background: rgba(5, 5, 10, 0.95); border: 1px solid #00ffcc; padding: 12px; font-family: 'Courier New', monospace; color: #00ffcc; z-index: 100; font-size: 11px; width: 220px; box-shadow: 0 0 15px rgba(0,255,204,0.15);">
        <div
            style="margin-bottom: 8px; font-weight: bold; border-bottom: 1px solid #00ffcc55; padding-bottom: 4px; display: flex; justify-content: space-between;">
            <span>3D GIMBAL</span>
            <span onclick="window.resetCamera()" style="cursor:pointer; color:#ff0055;"
                title="Reset View">[RESET]</span>
        </div>
        <div style="text-align: center; background: #020205; border: 1px solid #00ffcc33; padding: 4px;">
            <canvas id="gizmoCanvas" width="192" height="100"
                style="cursor: grab; display: block; margin: 0 auto;"></canvas>
            <div style="font-size: 9px; color: #00ffcc88; margin-top: 2px;">Click & Drag to Rotate Axes</div>
        </div>
    </div>

    <canvas id="hudCanvas"></canvas>
    <script type="module" src="/js/telemetryStream.js"></script>
    <script src="/js/snapshotEngine.js"></script>

    <!-- Main HUD Animation Script -->
    <script type="module">
        import { ReferenceFrameManager } from '/physics/reference_frames.js';
        const frameManager = new ReferenceFrameManager();
        const canvas = document.getElementById('hudCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Global Camera State
        let camera = {
            rotX: 0.3,
            rotY: 0.0,
            rotZ: 0.0,
            distance: 800
        };

        window.hudConfig = window.hudConfig || {
            worldScale: parseFloat(document.getElementById('slider-world-scale')?.value || 3.0),
            gridDensity: 10,
            warpExaggeration: 1.0,
            motionSpeed: 1.0,
            noiseThresh: 0.05,
            overlayIntensity: 1.0,
            colorPalette: 'dynamic',
            showFloor: document.getElementById('checkbox-floor') ? document.getElementById('checkbox-floor').checked : true,
            overlays: {}
        };

        document.getElementById('stream-filter-select')?.addEventListener('change', (e) => {
            const filterMode = e.target.value;
            window.hudConfig = window.hudConfig || {};
            window.hudConfig.streamFilter = filterMode;
            console.log(`[Spatial Control Deck] Telemetry Stream Filter set to: ${filterMode}`);
        });

        document.getElementById('interpolation-select')?.addEventListener('change', (e) => {
            const mode = e.target.value;
            window.hudConfig = window.hudConfig || {};
            window.hudConfig.interpolationMode = mode;
            console.log(`[Spatial Control Deck] Data Interpolation Mode set to: ${mode}`);
        });

        // Clean-Up: Palette dropdown updates diagnostic mode without destroying semantic node colors
        document.getElementById('palette-select')?.addEventListener('change', (e) => {
            const palette = e.target.value;
            window.hudConfig = window.hudConfig || {};
            window.hudConfig.colorPalette = palette;
            console.log(`[Spatial Control Deck] Diagnostic Schema set to: ${palette}`);
        });

        // Spatial Control Deck: Interference Overlays Toggle Bindings
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.overlay-toggle').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const targetBtn = e.currentTarget;
                    const key = targetBtn.getAttribute('data-overlay');
                    const isActive = targetBtn.classList.toggle('active');

                    window.hudConfig = window.hudConfig || {};
                    window.hudConfig.overlays = window.hudConfig.overlays || {};
                    window.hudConfig.overlays[key] = isActive;

                    console.log(`[Interference Deck] Overlay ${key} set to:`, isActive);
                });
            });
        });

        function initControlDeck() {
            window.hudConfig = window.hudConfig || {};
            window.hudConfig.worldScale = parseFloat(document.getElementById('slider-world-scale')?.value || 3.0);

            const floorCheckbox = document.getElementById('checkbox-floor');
            if (floorCheckbox) {
                window.hudConfig.showFloor = floorCheckbox.checked;
            } else {
                window.hudConfig.showFloor = true;
            }

            const telemetryStreamBtn = document.getElementById('telemetryStreamBtn');
            if (telemetryStreamBtn) {
                telemetryStreamBtn.removeAttribute('disabled');
                telemetryStreamBtn.addEventListener('click', window.openTelemetryStream);
            }
        }

        // --- Centralized Workspace Node State Store ---
        let _fallbackNodes = [
            {
                id: 'N-001',
                name: 'AdS Boundary Shell',
                type: 'TOPOLOGY',
                tier: 'BOUNDARY',
                x: 0, y: 120, z: 0,
                color: '#8b5cf6',
                isCore: false
            },
            {
                id: 'N-002',
                name: 'Minkowski Space',
                type: 'METRIC',
                tier: 'BULK_CORE',
                x: 0, y: 0, z: 0,
                color: '#ffffff',
                isCore: true
            },
            {
                id: 'N-003',
                name: 'Abelian U(1) EM',
                type: 'FIELD',
                tier: 'INTERMEDIATE',
                x: -70, y: 30, z: 60,
                color: '#10b981',
                isCore: false
            }
        ];

        window.nodes = _fallbackNodes;

        window.addEventListener('addTopologyNode', (e) => {
            const rawNode = e.detail;

            if (rawNode) {
                const verdict = window.physicsArbiter ? window.physicsArbiter.validateDrop(rawNode) : { status: 'APPROVED', node: rawNode };
                console.log(`[ARBITER VERDICT]: ${verdict.status}`);
                if (verdict.status === 'DENIED') return;

                const validatedNode = verdict.node;

                if (validatedNode && !nodes.some(n => n.id === validatedNode.id)) {
                    validatedNode.x = validatedNode.x || (Math.random() - 0.5) * 200;
                    validatedNode.y = validatedNode.y || 0;
                    validatedNode.z = validatedNode.z || (Math.random() - 0.5) * 200;

                    nodes.push(validatedNode);
                }
            }
        });

        // 3D Projection Pipeline
        function project3D(x, y, z, width, height) {
            const cx = x;
            const cy = y;
            const cz = z || 0.0;

            const cosY = Math.cos(camera.rotY), sinY = Math.sin(camera.rotY);
            const x1 = cx * cosY - cz * sinY;
            const z1 = cx * sinY + cz * cosY;

            const cosX = Math.cos(camera.rotX), sinX = Math.sin(camera.rotX);
            const y1 = cy * cosX - z1 * sinX;
            const z2 = cy * sinX + z1 * cosX;

            const cosZ = Math.cos(camera.rotZ), sinZ = Math.sin(camera.rotZ);
            const x2 = x1 * cosZ - y1 * sinZ;
            const y2 = x1 * sinZ + y1 * cosZ;

            const fov = camera.distance;
            const scale = fov / (fov + z2 + 300);

            return {
                px: width / 2 + x2 * scale,
                py: height / 2 + y2 * scale,
                scale: scale,
                depth: z2
            };
        }

        let userSelectedMode = 'open';
        window.setTopologyMode = function (mode) {
            if (!mode) return;
            userSelectedMode = mode;

            frameManager.activeFrameType = mode;
            frameManager.setMode(mode, window.nodes);

            const selectEl = document.getElementById('ref-frame-select');
            if (selectEl && selectEl.value !== mode) {
                selectEl.value = mode;
            }

            const count = window.nodes.length > 0 ? window.nodes.length : 8;
            const newNodes = [];

            for (let i = 0; i < count; i++) {
                let x = 0, y = 0, z = 0;
                const id = `N-00${i + 1}`;
                const isCore = (i === 0);

                if (mode === 'spheroid') {
                    const phi = Math.acos(-1 + (2 * i) / count);
                    const theta = Math.sqrt(count * Math.PI) * phi;
                    const r = 120;
                    x = r * Math.cos(theta) * Math.sin(phi);
                    y = r * Math.sin(theta) * Math.sin(phi);
                    z = r * Math.cos(phi);
                } else if (mode === 'cubed') {
                    const spacing = 100;
                    x = (i % 2 === 0 ? -1 : 1) * spacing;
                    y = (Math.floor(i / 2) % 2 === 0 ? -1 : 1) * spacing;
                    z = (Math.floor(i / 4) === 0 ? -1 : 1) * spacing;
                } else if (mode === 'toroidal') {
                    const R = 120, r = 40;
                    const u = (i / count) * Math.PI * 2;
                    const v = (i * 3) * Math.PI * 2 / count;
                    x = (R + r * Math.cos(v)) * Math.cos(u);
                    y = (R + r * Math.cos(v)) * Math.sin(u);
                    z = r * Math.sin(v);
                } else if (mode === 'hyperbolic') {
                    const sinhR = Math.sinh((i + 1) * 0.4) * 30;
                    const angle = i * 2.4;
                    x = sinhR * Math.cos(angle);
                    y = (i % 2 === 0 ? 1 : -1) * (i * 15);
                    z = sinhR * Math.sin(angle);
                } else {
                    x = (Math.random() - 0.5) * 300;
                    y = (Math.random() - 0.5) * 300;
                    z = (Math.random() - 0.5) * 150;
                }

                newNodes.push({ id, x, y, z, isCore });
            }
            window.nodes = newNodes;
            _fallbackNodes = newNodes;
        };

        window.resetCamera = function () {
            camera.rotX = 0.3;
            camera.rotY = 0.0;
            camera.rotZ = 0.0;
        };

        const gizmoCanvas = document.getElementById('gizmoCanvas');
        gizmoCanvas.width = 192;
        gizmoCanvas.height = 100;
        const gCtx = gizmoCanvas.getContext('2d');
        let isGizmoDragging = false;
        let gizmoLastX = 0;
        let gizmoLastY = 0;

        gizmoCanvas.addEventListener('mousedown', (e) => {
            isGizmoDragging = true;
            gizmoLastX = e.clientX;
            gizmoLastY = e.clientY;
            gizmoCanvas.style.cursor = 'grabbing';
        });

        window.addEventListener('mousemove', (e) => {
            if (!isGizmoDragging) return;
            const deltaX = e.clientX - gizmoLastX;
            const deltaY = e.clientY - gizmoLastY;

            camera.rotY += deltaX * 0.02;
            camera.rotX += deltaY * 0.02;
            camera.rotX = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, camera.rotX));

            gizmoLastX = e.clientX;
            gizmoLastY = e.clientY;
        });

        function drawGizmo() {
            gCtx.fillStyle = '#020205';
            gCtx.fillRect(0, 0, gizmoCanvas.width, gizmoCanvas.height);

            const cx = gizmoCanvas.width / 2;
            const cy = gizmoCanvas.height / 2;
            const len = 35;

            const axes = [
                { label: 'X', x: len, y: 0, z: 0, color: '#ff0055' },
                { label: 'Y', x: 0, y: len, z: 0, color: '#00ffcc' },
                { label: 'Z', x: 0, y: 0, z: len, color: '#0066ff' }
            ];

            axes.forEach(axis => {
                const cosY = Math.cos(camera.rotY), sinY = Math.sin(camera.rotY);
                const cosX = Math.cos(camera.rotX), sinX = Math.sin(camera.rotX);
                const cosZ = Math.cos(camera.rotZ), sinZ = Math.sin(camera.rotZ);

                let x1 = axis.x * cosY - axis.z * sinY;
                let z1 = axis.x * sinY + axis.z * cosY;
                let y1 = axis.y * cosX - z1 * sinX;
                let x2 = x1 * cosZ - y1 * sinZ;
                let y2 = x1 * sinZ + y1 * cosZ;

                        const stepY = p1.py + dy * t;

                    const nx = -dy / length;
                    const ny = dx / length;

                    for (let s = 1; s < segments; s++) {

                        const waveOffset = interpMode === 'spline' ? 1.5 : 1.0;

        function updateTensegrityEquilibrium() {

                    if (distToTarget < 1.0) {

                        node.y = node.targetY;
                        node.z = node.targetZ;

                        delete node.targetY;
                        delete node.targetZ;

                if (node.tier === 'BULK_CORE' || node.isCore) targetRadius = 30;
                else if (node.tier === 'BOUNDARY') targetRadius = 190;

                node.fy += (node.y / currentRadius) * radialError * springK;
                node.fz += (node.z / currentRadius) * radialError * springK;

                    const dy = other.y - node.y;

                        if (id === 'slider-motion-speed') window.hudConfig.motionSpeed = val;
                        if (id === 'slider-noise-thresh') window.hudConfig.noiseThresh = val;
                        if (id === 'slider-overlay-intensity') window.hudConfig.overlayIntensity = val;
                    }
                });
            }
        };

        const floorCheckbox = document.getElementById('checkbox-floor');
        if (floorCheckbox) {
            floorCheckbox.addEventListener('change', (e) => {
                if (window.hudConfig) {
                    window.hudConfig.showFloor = e.target.checked;
                }
            });
        }

        bindSlider('slider-world-scale', 'val-world-scale');
        bindSlider('slider-grid-density', 'val-grid-density');
        bindSlider('slider-motion-speed', 'val-motion-speed', 'x');
        bindSlider('slider-noise-thresh', 'val-noise-thresh');
        bindSlider('slider-overlay-intensity', 'val-overlay-intensity', 'x');

        resize();
        initControlDeck();

        animationLoop(); // <--- Kick-start the render loop here!
    </script>

    <script>
        document.getElementById('ref-frame-select').addEventListener('change', (e) => {
            e.stopImmediatePropagation();
            window.setTopologyMode(e.target.value);
        }, true);
    </script>

    <script src="/js/controlDeck.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="/js/testingSuiteWindow.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            window.testingSuite = new TestingSuiteWindow();
            const triggerBtn = document.getElementById("btn-test-suite-trigger");
            if (triggerBtn) {
                triggerBtn.addEventListener("click", () => {
                    window.testingSuite.toggleDrawer();
                });
            }
        });
    </script>
</body>

</html>
