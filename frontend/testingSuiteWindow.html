<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Scientific Testing & Validation Suite</title>
    <link rel="stylesheet" href="css/testingSuite.css">
    <style>
        body {
            background: #0f172a;
            margin: 0;
            padding: 15px;
            color: #f8fafc;
        }
    </style>
    <script src="backend/js/testingSuiteWindow.js?v=2.8.0" type="module"></script>
    <script src="backend/js/telemetryStream.js" type="module"></script>
</head>

<body>
    <script>
        // --- DOM Initialization & Telemetry Stream Listener ---
        document.addEventListener("DOMContentLoaded", () => {
            // Single unified instance assignment
            window.testingSuite = new TestingSuiteWindow();

            // Bind trigger button if present
            const triggerBtn = document.getElementById("btn-test-suite-trigger");
            if (triggerBtn) {
                triggerBtn.addEventListener("click", () => {
                    window.testingSuite.toggleDrawer();
                });
            }

            // Listen for live telemetry broadcasted from main window
            const channel = new BroadcastChannel('holographic_telemetry_channel');
            channel.onmessage = (event) => {
                if (event.data && window.testingSuite.isCapturing) {
                    window.testingSuite.logTelemetryFrame(event.data);
                }
            };
        });
    </script>
</body>

</html>
