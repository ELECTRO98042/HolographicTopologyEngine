<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase Space HUD - CH-04: Phase Space Constructor</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #050808;
            overflow: hidden;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        *,
        *:before,
        *:after {
            box-sizing: inherit;
        }
    </style>
    <script type="module" src="/js/controlDeck.js"></script>
    <script type="module" src="/js/PhaseSpaceViewer.js"></script>
</head>

<body style="display: flex; flex-direction: column; height: 100vh;">
    <!-- Top Header Bar -->
    <div
        style="height: 40px; border-bottom: 1px solid #00ffcc33; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 11px; color: #00ffcc;">
        <div>CH-04 // PHASE-SPACE RECONSTRUCTOR // INVARIANT LAB</div>
        <div style="display: flex; gap: 8px;">
            <button id="btnAttractor"
                style="background: #00ffcc; color: #000; border: none; padding: 4px 12px; font-weight: bold; cursor: pointer; font-family: monospace;">ATTRACTOR</button>
            <button id="btnPoincare"
                style="background: transparent; color: #00ffcc; border: 1px solid #00ffcc; padding: 4px 12px; font-weight: bold; cursor: pointer; font-family: monospace;">POINCARÉ</button>
        </div>
    </div>

    <!-- Main Workspace Body -->
    <div style="display: flex; flex: 1; gap: 20px; overflow: hidden; padding: 10px;">
        <!-- Left Sidebar: Metrics & Controls -->
        <div
            style="width: 260px; display: flex; flex-direction: column; gap: 12px; flex-shrink: 0; overflow-y: auto; padding-right: 5px;">
            <div style="background: #00ffcc08; border: 1px solid #00ffcc33; padding: 10px;">
                <div style="font-size: 10px; color: #00ffcc88; letter-spacing: 1px;">Phase Volume</div>
                <div id="psMetricVolume" style="font-size: 16px; color: #ff00ff; font-weight: bold; margin-top: 4px;">
                    1.4142</div>
            </div>
            <div style="background: #00ffcc08; border: 1px solid #00ffcc33; padding: 10px;">
                <div style="font-size: 10px; color: #00ffcc88; letter-spacing: 1px;">Lyapunov Exponent</div>
                <div id="psMetricLyapunov" style="font-size: 16px; color: #ff00ff; font-weight: bold; margin-top: 4px;">
                    +0.0384</div>
            </div>
            <div style="background: #00ffcc08; border: 1px solid #00ffcc33; padding: 10px;">
                <div style="font-size: 10px; color: #00ffcc88; letter-spacing: 1px;">Trajectory Divergence</div>
                <div id="psMetricDivergence"
                    style="font-size: 16px; color: #00ffcc; font-weight: bold; margin-top: 4px;">0.00%</div>
            </div>

            <!-- Dimension Slice Slicer -->
            <div style="background: #00ffcc08; border: 1px solid #00ffcc33; padding: 10px;">
                <div style="font-size: 10px; color: #00ffcc88; letter-spacing: 1px; margin-bottom: 6px;">Momentum Vector
                    Filter</div>
                <input type="range" id="psMomentumRange" min="0" max="100" value="50"
                    style="width: 100%; accent-color: #00ffcc; cursor: pointer;">
                <div id="psMomentumVal" style="font-size: 11px; color: #ff00ff; margin-top: 4px;">Vector: 1.000</div>
            </div>

            <!-- Shader Toggle -->
            <div style="background: #ff00ff08; border: 1px solid #ff00ff44; padding: 10px;">
                <div style="font-size: 10px; color: #ff00ffaa; letter-spacing: 1px; margin-bottom: 6px;">Phase Shader
                    Mode</div>
                <button id="psShaderToggle"
                    style="width: 100%; background: transparent; border: 1px solid #ff00ff; color: #ff00ff; padding: 6px; font-family: monospace; cursor: pointer; font-size: 11px;">Shader:
                    Vector Field (A)</button>
            </div>
        </div>

        <!-- Right Viewport: Canvas Phase Plotter -->
        <div
            style="flex: 1; background: #020404; border: 1px solid #00ffcc33; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden;">
            <canvas id="phaseCanvas" style="width: 100%; height: 100%; display: block;"></canvas>
        </div>
    </div>

    <script type="module">
        import { PhaseSpaceViewer } from '/js/PhaseSpaceViewer.js';

        window.addEventListener('DOMContentLoaded', () => {
            const container = document.body;
            const viewer = new PhaseSpaceViewer(container);
            window.phaseSpaceViewer = viewer;
            viewer.connect('/ws/phasespace');
        });
    </script>
</body>

</html>
